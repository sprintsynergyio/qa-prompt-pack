name: prompt-eval
on:
  workflow_dispatch:
    inputs:
      runs: { description: "runs per prompt variant", default: "3" }
      model: { description: "generation model", default: "openai/gpt-4o-mini" }
      judge: { description: "judge model", default: "openai/gpt-4.1" }
      tasks: { description: "comma list of task numbers (e.g. 06,09); empty = all", default: "" }
  pull_request:
    branches: [main]
    paths: ["prompts/**", "inputs/**", "eval/**", ".github/workflows/eval.yml"]
permissions:
  contents: read
  models: read          # kept for GitHub Models compatibility (service retired 30 Jul 2026; use MODELS_URL/MODELS_API_KEY)
concurrency:
  group: prompt-eval-${{ github.ref }}
  cancel-in-progress: false
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUNS: ${{ inputs.runs || '3' }}
      MODEL: ${{ inputs.model || 'openai/gpt-4o-mini' }}
      JUDGE: ${{ inputs.judge || 'openai/gpt-4.1' }}
      TASKS: ${{ inputs.tasks || '' }}
      MODELS_URL: ${{ vars.MODELS_URL || 'https://models.github.ai/inference/chat/completions' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r eval/requirements.txt
      - run: cd eval/harness && npm ci && npx playwright install --with-deps chromium
      - name: Install k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar xz
          echo "K6_BIN=$PWD/k6-v0.54.0-linux-amd64/k6" >> $GITHUB_ENV
      - run: python eval/count_tokens.py
      - name: Check model endpoint returns a chat completion
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MODELS_API_KEY: "${{ secrets.MODELS_API_KEY }}"
        run: |
          KEY="${MODELS_API_KEY:-$GITHUB_TOKEN}"
          code=$(curl -sS -o resp.json -w "%{http_code} %{content_type}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            "$MODELS_URL" -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"reply ok\"}],\"max_tokens\":5}")
          echo "endpoint: $MODELS_URL -> $code"; head -c 300 resp.json; echo
          echo "--- env proxies (names only):"; env | grep -i '_proxy' | cut -d= -f1 || echo none
          echo "--- full response headers, official GitHub headers:"
          curl -sS -D - -o /dev/null -H "Authorization: Bearer $KEY" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" "$MODELS_URL" -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}" | grep -vi '^set-cookie'
          echo "--- catalog:"; curl -sS -w " [HTTP %{http_code} %{content_type}]\n" https://models.github.ai/catalog/models | head -c 300; echo
          python -c "import json;d=json.load(open('resp.json'));print('completion:',d['choices'][0]['message']['content'])" \
            || { echo "::error::$MODELS_URL did not return a chat completion. GitHub Models was retired on 30 Jul 2026; set secret MODELS_API_KEY and variable MODELS_URL."; exit 1; }
      - name: Run eval
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MODELS_API_KEY: "${{ secrets.MODELS_API_KEY }}"
        run: |
          ARGS="--runs $RUNS --model $MODEL --judge $JUDGE"
          if [ -n "$TASKS" ]; then ARGS="$ARGS --tasks $TASKS"; fi
          python eval/run_eval.py $ARGS
      - name: Summarize
        if: always()
        run: python eval/summarize.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            results/
            runs/
